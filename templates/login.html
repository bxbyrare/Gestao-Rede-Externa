<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claro • Gestão Rede Externa</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style_v2.css') }}?v=6.3.0">
  <style>
    body.login-body {
      background: radial-gradient(circle at 50% 20%, #1e1e24 0%, #0a0a0c 100%);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #f8fafc;
    }
    .login-container {
      width: 100%;
      max-width: 440px;
    }
    .login-card-industrial {
      background: rgba(22, 22, 26, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 24px;
      padding: 36px 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(20px);
    }
    .login-header-brand {
      text-align: center;
      margin-bottom: 28px;
    }
    .claro-logo-img {
      width: 78px;
      height: 78px;
      background: #ffffff;
      border-radius: 50%;
      padding: 4px;
      object-fit: contain;
      margin-bottom: 14px;
      box-shadow: 0 8px 25px rgba(238, 44, 36, 0.55);
    }
    .brand-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.5px;
    }
    .brand-title span {
      color: #ee2c24;
    }
    .brand-subtitle {
      font-size: 0.82rem;
      color: #94a3b8;
      margin-top: 4px;
      font-weight: 500;
    }
    .input-icon-wrapper {
      position: relative;
      margin-top: 6px;
    }
    .input-icon-wrapper svg.left-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: #64748b;
      transition: color 0.2s ease;
    }
    /* Fix Chrome/Edge Browser Autofill White Background */
    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus,
    input:-webkit-autofill:active,
    textarea:-webkit-autofill,
    select:-webkit-autofill {
      -webkit-box-shadow: 0 0 0 1000px #141417 inset !important;
      -webkit-text-fill-color: #ffffff !important;
      transition: background-color 5000s ease-in-out 0s !important;
      caret-color: #ffffff !important;
    }

    .input-icon-wrapper input {
      padding-left: 44px !important;
      padding-right: 44px !important;
      height: 48px;
      background: rgba(255, 255, 255, 0.02) !important;
      border: 1px solid rgba(255, 255, 255, 0.05) !important;
      border-radius: 30px !important;
      color: #ffffff !important;
      font-size: 0.92rem !important;
      font-weight: 500 !important;
      transition: all 0.2s ease !important;
      width: 100%;
    }
    .input-icon-wrapper input:focus {
      border-color: rgba(238, 44, 36, 0.4) !important;
      background: rgba(238, 44, 36, 0.05) !important;
      box-shadow: 0 0 15px rgba(238, 44, 36, 0.1) !important;
    }
    .input-icon-wrapper input:focus + svg.left-icon {
      color: #ee2c24;
    }
    .btn-toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: #64748b;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s ease;
    }
    .btn-toggle-password:hover {
      color: #ffffff;
    }
    .btn-login-industrial {
      width: 100%;
      height: 50px;
      margin-top: 24px;
      background: rgba(238, 44, 36, 0.15) !important;
      border: 1px solid rgba(238, 44, 36, 0.3) !important;
      border-radius: 30px !important;
      color: #ee2c24 !important;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: none !important;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-login-industrial:hover {
      transform: translateY(-2px);
      background: rgba(238, 44, 36, 0.25) !important;
      border-color: rgba(238, 44, 36, 0.6) !important;
      box-shadow: 0 4px 15px rgba(238, 44, 36, 0.2) !important;
    }
    .error-banner-industrial {
      background: rgba(220, 38, 38, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #f87171;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
  </style>
</head>
<body class="login-body">

  <div class="login-container">
    <div class="login-card-industrial">
      <div class="login-header-brand">
        <!-- Official Claro Logo Image -->
        <img src="{{ url_for('static', filename='img/claro_logo.png') }}" class="claro-logo-img" alt="Claro Logo">

        <h2 class="brand-title">Gestão <span>REDE EXTERNA</span></h2>
        <p class="brand-subtitle">Plataforma Integrada de Engenharia & Operações</p>
      </div>

      {% if error %}
      <div class="error-banner-industrial">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width: 20px; height: 20px; shrink: 0;">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form action="{{ url_for('login') }}" method="POST" class="login-form">
        <div class="form-group" style="margin-bottom: 18px;">
          <label for="username" style="display: block; font-size: 0.84rem; font-weight: 700; color: #cbd5e1; margin-bottom: 6px;">Usuário de Acesso</label>
          <div class="input-icon-wrapper">
            <input type="text" id="username" name="username" placeholder="Digite seu usuário..." required autocomplete="username">
            <svg class="left-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 10px;">
          <label for="password" style="display: block; font-size: 0.84rem; font-weight: 700; color: #cbd5e1; margin-bottom: 6px;">Senha de Segurança</label>
          <div class="input-icon-wrapper">
            <input type="password" id="password" name="password" placeholder="••••••••••••" required autocomplete="current-password">
            <svg class="left-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
            <button type="button" class="btn-toggle-password" onclick="togglePasswordVisibility()" title="Mostrar/Ocultar Senha">
              <svg id="pwd-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width: 18px; height: 18px;">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-login-industrial" id="submit-btn" style="margin-top: 15px;">
          <span>Entrar no Sistema</span>
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width: 18px; height: 18px;">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
          </svg>
        </button>
      </form>
    </div>

    <div class="login-footer" style="text-align: center; margin-top: 24px; font-size: 0.75rem; color: #64748b;">
      <p>&copy; 2026 Claro Brasil.</p>
    </div>
  </div>

  <script>
    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('password');
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
      } else {
        pwdInput.type = 'password';
      }
    }

  </script>
</body>
</html>
